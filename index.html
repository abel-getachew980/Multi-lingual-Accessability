<!DOCTYPE html>
<html lang="am" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Tutor - Accessible Amharic/English learning assistant with voice and text support" />
    <meta name="theme-color" content="#1e40af" />
    
    <!-- Accessibility meta tags -->
    <meta name="screen-reader-optimized" content="true" />
    <meta name="keyboard-navigation" content="true" />
    
    <!-- PWA meta tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AI Tutor" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Preconnect to font source -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <title>AI Tutor - የአማርኛ ቱቶር</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Screen reader announcer element -->
    <div
      id="sr-announcer"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;"
    ></div>
  </body>
</html>
